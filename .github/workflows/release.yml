# GUI をビルドし、更新用の latest.json とともに GitHub Releases に公開する（DESIGN.md §28 GUI の自動更新）。
# 本番は tag v* の push、dev は master への push で公開する。
name: release

on:
  push:
    tags: ['v*']
    branches: [master]
    paths-ignore: ['docs/**', '**/*.md']

permissions:
  contents: write

# 古い dev の build が後から latest.json を戻さないよう、新しい push が来たら止める。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri
      - name: 公開する版を決める
        id: version
        shell: bash
        run: echo "version=$(node scripts/release-version.mjs "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER")" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/stage-gui-runtime.mjs
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: gui
          # gui/ には package.json が無く、CI の pnpm exec は root の tauri を見つけないため、CLI を直接実行する。
          tauriScript: node ${{ github.workspace }}/node_modules/@tauri-apps/cli/tauri.js
          # tauri の CLI は --config の相対パスを gui/ から解決しないため、絶対パスで渡す。
          args: --config ${{ github.workspace }}\gui\src-tauri\tauri.release.conf.json
          tagName: v${{ steps.version.outputs.version }}
          releaseName: Clodex v${{ steps.version.outputs.version }}
          releaseCommitish: ${{ github.sha }}
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
      - name: dev のチャンネルに latest.json を上げる
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          gh release download "$TAG" --pattern latest.json --dir dev-channel
          gh release view dev > /dev/null 2>&1 || gh release create dev --prerelease --title "Clodex dev" --notes "dev チャンネルの latest.json"
          gh release upload dev dev-channel/latest.json --clobber
      - name: 古い dev の prerelease を消す
        if: github.ref_type == 'branch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: 3
        run: |
          gh release list --limit 100 --json tagName,isPrerelease,createdAt \
            --jq "[.[] | select(.isPrerelease and (.tagName | test(\"^v.+-dev[.]\")))] | sort_by(.createdAt) | reverse | .[$KEEP:] | .[].tagName" |
            while read -r tag; do gh release delete "$tag" --yes --cleanup-tag; done
