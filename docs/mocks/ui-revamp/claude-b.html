<!doctype html>
<!--
  Clodex Web UI 改善モック — Claude 案 B「コマンドデッキ」
  狙い: 送り先切り替え .to の「くぼみ（--sunken）+ 浮き（--panel + 1px ring）+ 色は点だけ」を、レール・ドック・Agent ストリップ・シートまで全部品の共通言語にする。
  PC: 左端 56px の縦アイコンレール（会話 / 成果物 / 詳細 / 設定 / project を開く）+ 開閉できるサイドパネル（会話一覧・Agent の役割と設定）+ ログ。ヘッダは会話名と project の pill だけの 44px。
  PC: Agent の状態はログ上部の「Agent ストリップ」に集約（状態のアニメーション、ctx / 5時間 / 週のミニゲージ、中断・Compact・設定のアイコン操作）。作業中・質問のタブは 0 件なら出さない。
  スマホ: 親指ゾーン中心のボトムドック。上は 40px のステータス（会話名と Agent の状態点 2 つ）、下に入力欄とログ / 会話 / Agent / メニューのタブ。各画面はドックから伸びるボトムシート（つまみ、下スワイプ、半分 / 全体の 2 段）。
  スマホ: 送り先は入力欄左の .to 小型版（点 2 つ、44px）。キーボード表示中はタブを隠してログを最大化。ログはアバターを見出し行に入れて本文を全幅に。コードは畳んで「全文」とコピー。
  ロード: 上端 2px の不確定バー、ボタン内スピナー、skeleton、「起動中…」の仮ターン、再接続の帯（CLOSED は再読み込み）、前ページ読み込み行、アップロード中チップ。右端の「デモ」から切り替え。
  トレードオフ: PC とスマホで骨格が別になり、DOM はほぼ共通でも CSS とシートの出し方（中央ダイアログ / ドック上のシート）を 2 系統持つ。
  トレードオフ: Agent 情報がストリップ（状態・ゲージ）とサイドパネル（役割・設定値）に分かれる。スマホではドックが常に 64px を使う代わりに、上部の固定部分を 40px まで削る。
  URL: ?theme=light|dark &demo=loading|boot|history,starting,sending,upload,reconnect,closed,toast,newer &open=sheet|drawer|agents|menu|settings|artifacts|working &kbd=1 &panel=1 &shot=1
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Clodex — 案 B コマンドデッキ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  /* ---- テーマ: src/web/web-page.ts の :root をそのまま ---- */
  :root {
    --bg: #fafafa; --panel: #ffffff; --sunken: #f2f2f3; --line: #e6e6e8; --line-strong: #d4d4d8;
    --fg: #111113; --fg-2: #3f3f46; --muted: #80808a;
    --claude: #b4793f; --codex: #4b6fa5; --code: #6f9a5a;
    --invert-bg: #111113; --invert-fg: #fafafa;
    --warn: #b7791f; --crit: #d14343; --scrim: rgba(17, 17, 19, .32);
    --font-ui: "Geist", "Zen Kaku Gothic New", system-ui, sans-serif;
    --font-mono: "Geist Mono", "Zen Kaku Gothic New", ui-monospace, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0b0b0c; --panel: #111113; --sunken: #18181b; --line: #232326; --line-strong: #2f2f34;
    --fg: #f4f4f5; --fg-2: #c8c8cd; --muted: #7c7c86;
    --claude: #d7a26d; --codex: #8aa9d8;
    --invert-bg: #f4f4f5; --invert-fg: #0b0b0c;
    --warn: #e0a84a; --crit: #ef6b6b; --scrim: rgba(0, 0, 0, .55); color-scheme: dark;
  } }
  :root[data-theme="dark"] {
    --bg: #0b0b0c; --panel: #111113; --sunken: #18181b; --line: #232326; --line-strong: #2f2f34;
    --fg: #f4f4f5; --fg-2: #c8c8cd; --muted: #7c7c86;
    --claude: #d7a26d; --codex: #8aa9d8;
    --invert-bg: #f4f4f5; --invert-fg: #0b0b0c;
    --warn: #e0a84a; --crit: #ef6b6b; --scrim: rgba(0, 0, 0, .55); color-scheme: dark;
  }
  /* ---- 部品の共通値（色は増やさない） ---- */
  :root {
    --t: 120ms; --ease: cubic-bezier(.2, .7, .2, 1);
    --ring: 0 0 0 1px var(--line);
    --lift: 0 0 0 1px var(--line), 0 1px 2px rgba(0, 0, 0, .06);
    --pop: 0 0 0 1px var(--line), 0 12px 32px rgba(0, 0, 0, .16);
    --tap: 44px; --rail: 56px; --side: 284px;
    --sbar: 40px; --dock: 64px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14.5px; line-height: 1.6;
    -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  :focus-visible, .is-focus { outline: 2px solid var(--fg); outline-offset: 2px; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .i.s { width: 15px; height: 15px; }
  .dot { width: 6px; height: 6px; border-radius: 1.5px; flex: none; background: currentColor; opacity: .5; display: inline-block; }
  .dot.claude { background: var(--claude); opacity: 1; } .dot.codex { background: var(--codex); opacity: 1; }
  .dot.warn { background: var(--warn); opacity: 1; } .dot.ok { background: var(--code); opacity: 1; } .dot.crit { background: var(--crit); opacity: 1; }
  .mark { width: 22px; height: 22px; border-radius: 5px; display: inline-grid; place-items: center; flex: none;
    font: 600 11px/1 var(--font-mono); color: var(--invert-fg); }
  .mark.claude { background: var(--claude); } .mark.codex { background: var(--codex); } .mark.you { background: var(--fg); }

  /* ================= 部品: .to のデザイン言語 =================
     well = くぼみ（--sunken）。opt = well の中の選択肢（選ぶと --panel で浮き 1px ring）
     ib = アイコンボタン。btn = 文字のボタン（休止で浮き、押すと沈む）。primary（白黒反転）は 1 画面 1 個 */
  .well { display: flex; gap: 2px; padding: 2px; background: var(--sunken); border-radius: 8px; min-width: 0; }
  .well.col { flex-direction: column; }
  .opt { border: 0; background: transparent; border-radius: 6px; padding: 5px 10px; font-size: 12.5px; color: var(--muted);
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; position: relative; min-width: 0;
    transition: background-color var(--t) var(--ease), color var(--t), box-shadow var(--t), transform var(--t); }
  .opt:hover, .opt.is-hover { color: var(--fg-2); background: color-mix(in srgb, var(--panel) 55%, transparent); }
  .opt:active, .opt.is-press { transform: scale(.97); }
  .opt[aria-pressed="true"], .opt[aria-selected="true"], .opt[aria-current="true"] { background: var(--panel); color: var(--fg); box-shadow: var(--lift); }
  .opt:disabled { opacity: .4; cursor: default; transform: none; background: transparent; }
  .opt .dot { opacity: .45; }
  .opt[aria-pressed="true"] .dot { opacity: 1; }

  .ib { border: 0; background: transparent; color: var(--muted); width: 32px; height: 32px; border-radius: 7px; padding: 0;
    display: inline-grid; place-items: center; flex: none; position: relative;
    transition: background-color var(--t) var(--ease), color var(--t), box-shadow var(--t), transform var(--t); }
  .ib:hover, .ib.is-hover { background: var(--sunken); color: var(--fg); }
  .ib:active, .ib.is-press { transform: scale(.92); background: var(--line); }
  .ib[aria-pressed="true"], .ib[aria-expanded="true"] { background: var(--panel); color: var(--fg); box-shadow: var(--lift); }
  .ib:disabled { opacity: .35; cursor: default; background: transparent; transform: none; color: var(--muted); }
  .ib.danger:not(:disabled):hover { color: var(--crit); }

  .btn { border: 0; background: var(--panel); color: var(--fg); box-shadow: var(--lift); border-radius: 7px; padding: 6px 12px; font-size: 13px;
    font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 7px; position: relative; flex: none; min-height: 32px;
    transition: background-color var(--t) var(--ease), color var(--t), box-shadow var(--t), transform var(--t); }
  .btn:hover, .btn.is-hover { box-shadow: 0 0 0 1px var(--line-strong), 0 2px 6px rgba(0, 0, 0, .08); }
  .btn:active, .btn.is-press { background: var(--sunken); box-shadow: inset 0 0 0 1px var(--line); transform: translateY(.5px); }
  .btn[aria-pressed="true"] { background: var(--sunken); box-shadow: inset 0 0 0 1px var(--line-strong); }
  .btn:disabled { opacity: .4; cursor: default; box-shadow: var(--ring); transform: none; }
  .btn.primary { background: var(--invert-bg); color: var(--invert-fg); box-shadow: none; }
  .btn.primary:hover, .btn.primary.is-hover { box-shadow: 0 2px 10px rgba(0, 0, 0, .18); }
  .btn.primary:active, .btn.primary.is-press { opacity: .85; }
  .btn.danger { color: var(--crit); }
  .btn.wide { width: 100%; min-height: 40px; }

  /* loading: 中身を隠してスピナーを重ねる。幅は変えない */
  .is-loading { pointer-events: none; }
  .is-loading > * { visibility: hidden; }
  .is-loading::after { content: ""; position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%;
    border: 1.6px solid currentColor; border-right-color: transparent; animation: rot .7s linear infinite; }
  .ib.is-loading, .btn.is-loading:not(.primary) { color: var(--fg-2); }
  .spin { width: 13px; height: 13px; border-radius: 50%; border: 1.6px solid currentColor; border-right-color: transparent; animation: rot .7s linear infinite; flex: none; display: inline-block; }
  @keyframes rot { to { transform: rotate(360deg); } }

  .sk { display: block; border-radius: 5px; background: linear-gradient(90deg, var(--sunken) 0%, color-mix(in srgb, var(--line-strong) 55%, var(--sunken)) 45%, var(--sunken) 90%);
    background-size: 220% 100%; animation: shimmer 1.3s linear infinite; }
  @keyframes shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }

  .eyebrow { font-size: 11px; color: var(--muted); letter-spacing: .06em; margin: 16px 0 6px; display: flex; align-items: center; gap: 8px; }
  .chip { border: 0; background: var(--sunken); color: var(--fg-2); border-radius: 6px; padding: 2px 8px; font: 11.5px/1.5 var(--font-mono);
    display: inline-flex; align-items: center; gap: 6px; max-width: 100%; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: background-color var(--t), box-shadow var(--t), color var(--t); }
  button.chip:hover { background: var(--panel); box-shadow: var(--lift); color: var(--fg); }
  button.chip:active { transform: scale(.97); }

  /* ================= 上端のプログレス・再接続 ================= */
  .progress { position: fixed; inset: 0 0 auto; height: 2px; z-index: 90; overflow: hidden; pointer-events: none; }
  .progress::before { content: ""; position: absolute; top: 0; bottom: 0; left: -35%; width: 35%; background: var(--fg);
    animation: indet 1.15s var(--ease) infinite; }
  @keyframes indet { from { left: -35%; } to { left: 100%; } }
  .conn { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 6px 16px; font-size: 12.5px;
    background: color-mix(in srgb, var(--warn) 14%, var(--panel)); color: var(--fg); border-bottom: 1px solid color-mix(in srgb, var(--warn) 35%, var(--line)); min-height: 34px; }
  .conn .spin { color: var(--warn); }
  .conn.closed { background: color-mix(in srgb, var(--crit) 10%, var(--panel)); border-bottom-color: color-mix(in srgb, var(--crit) 30%, var(--line)); }
  .conn .btn { min-height: 26px; padding: 2px 10px; font-size: 12px; }

  /* ================= 骨格（PC） ================= */
  .app { display: grid; height: 100dvh; grid-template-columns: var(--rail) auto minmax(0, 1fr); min-width: 0; }
  .rail { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0 12px; background: var(--sunken);
    border-right: 1px solid var(--line); }
  .logo { width: 28px; height: 28px; margin-bottom: 10px; }
  .rail .ib { width: 40px; height: 40px; border-radius: 10px; }
  .rail .ib .i { width: 20px; height: 20px; }
  .rail .ib:hover { background: color-mix(in srgb, var(--panel) 60%, transparent); }
  .rail .ib[aria-pressed="true"]::before, .rail .ib[aria-expanded="true"]::before { content: ""; position: absolute; left: -8px; top: 10px; bottom: 10px; width: 2px; border-radius: 0 2px 2px 0; background: var(--fg); }
  .rail .sep { flex: 1; }
  .side { width: var(--side); background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; overflow: hidden;
    transition: width 180ms var(--ease); }
  body.side-closed .side { width: 0; border-right-width: 0; }
  .side-inner { width: var(--side); padding: 10px 12px 16px; overflow-y: auto; display: flex; flex-direction: column; min-height: 0; flex: 1; }
  .side-head { display: flex; align-items: center; gap: 6px; height: 34px; }
  .side-head h2 { margin: 0; font-size: 13px; font-weight: 600; flex: 1; }
  .main { display: grid; grid-template-rows: auto auto auto minmax(0, 1fr) auto auto; min-width: 0; min-height: 0; }

  .top { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--panel); min-width: 0; }
  .top h1 { margin: 0; font-size: 13.5px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill { border: 0; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px 0 9px; border-radius: 8px; background: var(--sunken);
    color: var(--fg-2); font-size: 12.5px; flex: none; max-width: 260px; position: relative;
    transition: background-color var(--t), box-shadow var(--t), color var(--t); }
  .pill:hover { background: var(--panel); box-shadow: var(--lift); color: var(--fg); }
  .pill:active { transform: scale(.98); }
  .pill[aria-expanded="true"] { background: var(--panel); box-shadow: var(--lift); color: var(--fg); }
  .pill .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---- Agent ストリップ ---- */
  .strip { display: flex; gap: 8px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--bg); min-width: 0; }
  .strip-well { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 2px; background: var(--sunken); border-radius: 12px; min-width: 0; }
  .acard { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 10px; padding: 7px 8px 7px 10px; border-radius: 10px;
    background: var(--panel); box-shadow: var(--lift); min-width: 0; position: relative; overflow: hidden; min-height: 52px; }
  .acard .who { min-width: 0; display: grid; }
  .acard .nm { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; min-width: 0; }
  .acard .sub { font: 11.5px/1.4 var(--font-mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .acard.busy::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 1.5px;
    background: linear-gradient(90deg, transparent, var(--agent), transparent); background-size: 50% 100%; background-repeat: no-repeat; animation: sweep 1.6s linear infinite; }
  .acard[data-agent="claude"] { --agent: var(--claude); } .acard[data-agent="codex"] { --agent: var(--codex); }
  @keyframes sweep { from { background-position: -60% 0; } to { background-position: 160% 0; } }
  .acts { display: flex; gap: 2px; }
  .st { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 400; color: var(--muted); white-space: nowrap; }
  .st .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--agent, var(--fg)); position: relative; }
  .st.busy { color: var(--fg); }
  .st.busy .pulse::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 1px solid var(--agent, var(--fg)); animation: ping 1.4s ease-out infinite; }
  @keyframes ping { from { transform: scale(.6); opacity: 1; } to { transform: scale(1.8); opacity: 0; } }
  .st.idle .pulse { background: var(--muted); opacity: .6; }
  .st.stopped .pulse { background: transparent; box-shadow: inset 0 0 0 1px var(--muted); }
  .st .el { font: 11.5px var(--font-mono); color: var(--muted); }
  .minis { display: grid; gap: 3px; width: 136px; }
  .mini { display: grid; grid-template-columns: 30px minmax(0, 1fr) 30px; align-items: center; gap: 6px; font-size: 10.5px; line-height: 12px; color: var(--muted); }
  .mini b { font: 500 10.5px/12px var(--font-mono); color: var(--fg-2); text-align: right; }
  .acard .acts .ib { width: 28px; height: 28px; }
  .mini.over b { color: var(--warn); }
  .track { height: 4px; border-radius: 2px; background: var(--sunken); box-shadow: inset 0 0 0 1px var(--line); position: relative; overflow: visible; }
  .track > i { position: absolute; inset: 0 auto 0 0; border-radius: 2px; background: var(--fg-2); }
  .over .track > i { background: var(--warn); }
  .track .tick { position: absolute; top: -2px; width: 1.5px; height: 8px; background: var(--muted); border-radius: 1px; }
  .strip-tabs { display: grid; gap: 2px; padding: 2px; background: var(--sunken); border-radius: 12px; align-content: stretch; }
  .stab { border: 0; background: transparent; border-radius: 9px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; font-size: 12px; color: var(--fg-2);
    transition: background-color var(--t), box-shadow var(--t), transform var(--t); }
  .stab:hover { background: color-mix(in srgb, var(--panel) 60%, transparent); }
  .stab:active { transform: scale(.97); }
  .stab[aria-expanded="true"] { background: var(--panel); box-shadow: var(--lift); color: var(--fg); }
  .stab b { font: 500 11.5px var(--font-mono); }
  .stab.q .i { color: var(--warn); }

  /* ---- ログ ---- */
  .log-wrap { position: relative; min-height: 0; display: grid; }
  .log { overflow-y: auto; overscroll-behavior: contain; padding: 4px 32px 28px; min-width: 0; }
  .log-inner { max-width: 860px; margin: 0 auto; display: grid; min-width: 0; }
  .entry { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 4px 12px; padding: 16px 0; border-bottom: 1px solid var(--line); min-width: 0; }
  .entry > :not(.mark):not(.head) { grid-column: 2; min-width: 0; }
  .entry .head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 13px; min-width: 0; min-height: 22px; }
  .entry .head b { font-weight: 600; }
  .entry .head time, .entry .head .to-who { color: var(--muted); font-size: 12px; }
  .entry .head .res { margin-left: auto; }
  .body { overflow-wrap: anywhere; color: var(--fg-2); }
  .entry.you .body { color: var(--fg); }
  .md > * { margin: 0 0 10px; } .md > *:last-child { margin-bottom: 0; }
  .md ul { padding-left: 1.2em; }
  code { font-family: var(--font-mono); font-size: .92em; padding: 1px 5px; border-radius: 4px; background: var(--sunken); color: var(--code); overflow-wrap: anywhere; }
  .plan { color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; }
  .steps summary, .envelope summary { list-style: none; cursor: pointer; font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 8px 3px 6px; margin-left: -6px; border-radius: 6px; transition: background-color var(--t), color var(--t); }
  .steps summary::-webkit-details-marker, .envelope summary::-webkit-details-marker { display: none; }
  .steps summary:hover, .envelope summary:hover { background: var(--sunken); color: var(--fg-2); }
  .steps summary .i, .envelope summary .i { transition: transform var(--t); }
  .steps[open] summary .i, .envelope[open] summary .i { transform: rotate(90deg); }
  .steps ol { list-style: none; margin: 6px 0 4px; padding: 8px 10px; display: grid; gap: 3px; background: var(--sunken); border-radius: 8px; }
  .steps li { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; font-size: 12.5px; }
  .steps .k { color: var(--muted); font: 11px/1.9 var(--font-mono); }
  .steps .run { font: 12px/1.7 var(--font-mono); color: var(--fg-2); overflow-wrap: anywhere; }
  .now { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 12.5px; color: var(--muted); padding: 4px 10px; border-radius: 8px; background: var(--sunken); }
  .now .what { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--font-mono); font-size: 12px; color: var(--fg-2); flex: 1; }
  .now .el { font: 11.5px var(--font-mono); }
  .now .spin { color: var(--codex); }

  .code { border-radius: 10px; background: var(--sunken); position: relative; min-width: 0; overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
  .code-head { display: flex; align-items: center; gap: 6px; padding: 3px 4px 3px 12px; border-bottom: 1px solid var(--line); font-size: 11.5px; color: var(--muted); min-width: 0; }
  .code-head .file { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-mono); }
  .code-head .ib { width: 28px; height: 28px; }
  .code pre { margin: 0; padding: 10px 14px; font: 12.5px/1.65 var(--font-mono); color: var(--fg-2); overflow-x: auto; white-space: pre; tab-size: 2; }
  .code pre .kw { color: var(--fg); font-weight: 500; } .code pre .s { color: var(--code); } .code pre .c { color: var(--muted); }
  .code.collapsed pre { max-height: calc(1.65em * 6 + 20px); overflow: hidden; }
  .code-more { display: none; }
  .code.collapsed .code-more { display: flex; position: absolute; left: 0; right: 0; bottom: 0; height: 56px; align-items: end; justify-content: center; padding-bottom: 8px;
    background: linear-gradient(transparent, var(--sunken) 70%); border: 0; }
  .code-more .btn { min-height: 28px; padding: 2px 12px; font-size: 12px; }

  .tbl { overflow-x: auto; max-width: 100%; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line);
    background: linear-gradient(to right, var(--bg) 30%, transparent), linear-gradient(to left, var(--bg) 30%, transparent) 100% 0,
      linear-gradient(to right, rgba(0,0,0,.14), transparent), linear-gradient(to left, rgba(0,0,0,.14), transparent) 100% 0;
    background-repeat: no-repeat; background-size: 32px 100%, 32px 100%, 10px 100%, 10px 100%; background-attachment: local, local, scroll, scroll; }
  .tbl table { border-collapse: collapse; font-size: 13px; min-width: 100%; }
  .tbl th, .tbl td { padding: 6px 12px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line); }
  .tbl tr:last-child td { border-bottom: 0; }
  .tbl th { font-weight: 500; color: var(--muted); font-size: 12px; }
  .tbl td .dot { margin-right: 6px; vertical-align: 1px; }

  .handoff { padding: 14px 0; border-bottom: 1px solid var(--line); display: grid; gap: 8px; min-width: 0; }
  .route { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 13px; }
  .route .arrow { color: var(--muted); }
  .kind { font: 500 11px/1 var(--font-mono); letter-spacing: .04em; padding: 4px 7px; border-radius: 5px; background: var(--sunken); color: var(--fg-2); box-shadow: var(--ring); display: inline-flex; gap: 6px; align-items: center; }
  .route .task { margin-left: auto; color: var(--muted); font: 12px var(--font-mono); }
  .handoff .text { color: var(--fg); overflow-wrap: anywhere; padding-left: 12px; border-left: 2px solid var(--line-strong); }
  .refs { display: flex; flex-wrap: wrap; gap: 6px; }
  .ref { border: 0; background: var(--sunken); border-radius: 6px; padding: 2px 8px; font: 12px/1.6 var(--font-mono); color: var(--fg-2); display: inline-flex; align-items: center; gap: 6px;
    transition: background-color var(--t), box-shadow var(--t); }
  .ref:hover { background: var(--panel); box-shadow: var(--lift); }
  .envelope pre { margin: 6px 0 0; padding: 10px 12px; border-radius: 8px; background: var(--sunken); font: 12px/1.6 var(--font-mono); color: var(--fg-2); white-space: pre-wrap; }

  .ask { margin-top: 2px; padding: 12px; border-radius: 12px; background: var(--panel); box-shadow: var(--lift); display: grid; gap: 10px; }
  .ask .q { margin: 0; color: var(--fg); }
  .ask .opts { display: grid; gap: 2px; }
  .ask .opt { justify-content: flex-start; text-align: left; padding: 8px 10px; gap: 10px; font-size: 13px; color: var(--fg-2); min-height: 40px; }
  .ask .opt .radio { width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line-strong); flex: none; display: grid; place-items: center; }
  .ask .opt[aria-pressed="true"] .radio { box-shadow: inset 0 0 0 1.5px var(--fg); }
  .ask .opt[aria-pressed="true"] .radio::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--fg); }
  .ask .opt small { display: block; color: var(--muted); font-size: 12px; }
  .ask .foot { display: flex; gap: 8px; align-items: center; }
  .field { flex: 1; min-width: 0; border: 0; background: var(--sunken); border-radius: 8px; padding: 7px 10px; font-size: 13px; outline: none; box-shadow: inset 0 0 0 1px transparent;
    transition: box-shadow var(--t), background-color var(--t); color: var(--fg); }
  .field:hover { box-shadow: inset 0 0 0 1px var(--line-strong); }
  .field:focus { background: var(--panel); box-shadow: 0 0 0 1px var(--fg-2); }
  .field::placeholder { color: var(--muted); }

  .notice { padding: 10px 0; font-size: 12.5px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid var(--line); color: var(--muted); }
  .hist { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 0; font-size: 12px; color: var(--muted); }
  .sk-entry { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px 12px; padding: 16px 0; border-bottom: 1px solid var(--line); }
  .sk-entry .lines { display: grid; gap: 8px; }
  .provisional .body { display: grid; gap: 8px; }
  .provisional .st { color: var(--fg-2); }
  .provisional .st .spin { color: var(--agent); }

  .newer { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); border: 0; border-radius: 999px; padding: 6px 14px 6px 12px; min-height: 32px;
    font-size: 12.5px; font-weight: 500; background: var(--panel); color: var(--fg); box-shadow: var(--pop); display: inline-flex; align-items: center; gap: 6px; }
  .newer:hover { box-shadow: 0 0 0 1px var(--line-strong), 0 12px 32px rgba(0,0,0,.2); }

  /* ---- 入力欄 ---- */
  .composer { padding: 8px 32px 16px; background: var(--bg); }
  .composer-in { max-width: 860px; margin: 0 auto; }
  .box { border-radius: 12px; background: var(--panel); box-shadow: 0 0 0 1px var(--line-strong); display: grid; transition: box-shadow var(--t); min-width: 0; }
  .box:focus-within, .box.is-focus { box-shadow: 0 0 0 1px var(--fg-2), 0 4px 16px rgba(0, 0, 0, .06); outline: 0; }
  .pending { list-style: none; margin: 0; padding: 4px 4px 4px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 2px; }
  .pending li { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 12.5px; }
  .pending .who { flex: none; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .pending .text { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .uploads { display: flex; gap: 6px; padding: 8px 8px 0; flex-wrap: wrap; }
  .up { display: inline-flex; align-items: center; gap: 8px; padding: 3px 4px 3px 3px; border-radius: 8px; background: var(--sunken); font-size: 12px; color: var(--fg-2); max-width: 240px; }
  .up .thumb { width: 30px; height: 30px; border-radius: 6px; flex: none; position: relative; overflow: hidden;
    background: linear-gradient(135deg, color-mix(in srgb, var(--codex) 40%, var(--sunken)), color-mix(in srgb, var(--claude) 40%, var(--sunken))); }
  .up .thumb::after { content: ""; position: absolute; inset: 0; background: color-mix(in srgb, var(--panel) 55%, transparent); }
  .up .thumb .spin { position: absolute; left: 8px; top: 8px; z-index: 1; color: var(--fg); }
  .up .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: grid; line-height: 1.3; }
  .up .nm small { color: var(--muted); font-size: 11px; }
  .up .ib { width: 26px; height: 26px; }
  textarea.input { display: block; width: 100%; border: 0; background: transparent; resize: none; color: var(--fg); min-height: 44px; max-height: 40vh; outline: none;
    padding: 12px 14px 4px; line-height: 1.55; }
  textarea.input::placeholder { color: var(--muted); }
  .bar { display: flex; align-items: center; gap: 6px; padding: 6px 8px 8px 8px; }
  .bar .grow { flex: 1; }
  .to .opt[data-agent]::before { content: ""; width: 6px; height: 6px; border-radius: 1.5px; background: currentColor; opacity: .45; }
  .to .opt[data-agent="claude"][aria-pressed="true"]::before { background: var(--claude); opacity: 1; }
  .to .opt[data-agent="codex"][aria-pressed="true"]::before { background: var(--codex); opacity: 1; }
  .send { width: 36px; height: 36px; border-radius: 9px; padding: 0; display: inline-grid; place-items: center; border: 0; position: relative; flex: none;
    background: var(--invert-bg); color: var(--invert-fg); transition: transform var(--t), opacity var(--t), box-shadow var(--t); }
  .send:hover { box-shadow: 0 2px 10px rgba(0,0,0,.2); }
  .send:active { transform: scale(.93); }
  .send:disabled { opacity: .35; cursor: default; box-shadow: none; transform: none; }
  .send .sdot { position: absolute; right: -2px; top: -2px; width: 9px; height: 9px; border-radius: 2.5px; box-shadow: 0 0 0 2px var(--bg); }
  .send .sdot.claude { background: var(--claude); } .send .sdot.codex { background: var(--codex); }
  .send.is-loading .sdot { visibility: visible; }

  /* ---- シート（PC は中央ダイアログ） ---- */
  .layer { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; }
  .scrim { position: absolute; inset: 0; background: var(--scrim); border: 0; animation: fade 160ms var(--ease); }
  .sheet { position: relative; width: min(580px, calc(100vw - 32px)); max-height: 86vh; display: flex; flex-direction: column; background: var(--panel); border-radius: 16px;
    box-shadow: var(--pop); animation: pop 180ms var(--ease); min-height: 0; }
  .sheet.wide { width: min(900px, calc(100vw - 32px)); }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.985); } }
  @keyframes fade { from { opacity: 0; } }
  .grab { display: none; }
  .sheet-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 8px 18px; }
  .sheet-head h2 { margin: 0; font-size: 15px; font-weight: 600; flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .sheet-body { padding: 0 18px 18px; overflow-y: auto; min-height: 0; overscroll-behavior: contain; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
  .seg .opt { min-height: 34px; }
  .role-editor { width: 100%; min-height: 96px; resize: vertical; border: 0; border-radius: 8px; background: var(--sunken); color: var(--fg); padding: 10px 12px; outline: none;
    box-shadow: inset 0 0 0 1px transparent; transition: box-shadow var(--t), background-color var(--t); line-height: 1.55; display: block; }
  .role-editor:hover { box-shadow: inset 0 0 0 1px var(--line-strong); }
  .role-editor:focus { background: var(--panel); box-shadow: 0 0 0 1px var(--fg-2); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .row .note { flex: 1; font-size: 12px; color: var(--muted); }
  .select { position: relative; flex: 1; min-width: 0; display: flex; }
  .select select { appearance: none; width: 100%; border: 0; border-radius: 8px; background: var(--sunken); color: var(--fg); padding: 7px 32px 7px 10px; font: 13px var(--font-mono); min-height: 34px;
    transition: box-shadow var(--t), background-color var(--t); outline: none; }
  .select select:hover { box-shadow: inset 0 0 0 1px var(--line-strong); }
  .select select:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .select .i { position: absolute; right: 9px; top: 50%; margin-top: -8px; width: 16px; height: 16px; pointer-events: none; color: var(--muted); }
  .hint-warn { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-top: 6px; }

  /* 会話一覧・メニュー行 */
  .convs { display: grid; gap: 2px; padding: 2px; background: var(--sunken); border-radius: 10px; }
  .conv-row { display: flex; align-items: center; border-radius: 8px; min-width: 0; transition: background-color var(--t), box-shadow var(--t); }
  .conv-row:hover { background: color-mix(in srgb, var(--panel) 55%, transparent); }
  .conv-row[aria-current="true"] { background: var(--panel); box-shadow: var(--lift); }
  .conv { flex: 1; min-width: 0; border: 0; background: transparent; text-align: left; display: grid; gap: 1px; padding: 7px 4px 7px 10px; font-size: 13px; border-radius: 8px; }
  .conv:active { transform: scale(.99); }
  .conv .t { display: flex; align-items: center; gap: 7px; min-width: 0; color: var(--fg-2); }
  .conv-row[aria-current="true"] .conv .t { color: var(--fg); font-weight: 500; }
  .conv .t span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv .m { color: var(--muted); font-size: 11.5px; display: flex; align-items: center; gap: 6px; }
  .conv-row .ib { opacity: 0; width: 28px; height: 28px; margin-right: 4px; }
  .conv-row:hover .ib, .conv-row[aria-current="true"] .ib, .conv-row .ib:focus-visible, .conv-row .ib[aria-expanded="true"] { opacity: 1; }
  .conv-row.loading .conv .t::after { content: ""; width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--muted); border-right-color: transparent; animation: rot .7s linear infinite; flex: none; margin-left: auto; }
  .sk-conv { padding: 9px 10px; display: grid; gap: 6px; }
  .agents-mini { display: grid; gap: 8px; }
  .amini { padding: 10px; border-radius: 10px; background: var(--sunken); display: grid; gap: 6px; }
  .amini .hd { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
  .amini .hd .ib { margin-left: auto; width: 28px; height: 28px; }
  .amini .role { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .amini .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .amini .chip { background: var(--panel); box-shadow: var(--ring); }
  .amini .chip.loading::after { content: ""; width: 9px; height: 9px; border-radius: 50%; border: 1.4px solid var(--muted); border-right-color: transparent; animation: rot .7s linear infinite; }

  .mrow { width: 100%; border: 0; background: transparent; display: flex; align-items: center; gap: 12px; padding: 0 10px; min-height: 44px; border-radius: 8px; text-align: left; font-size: 14px; color: var(--fg);
    transition: background-color var(--t), box-shadow var(--t); }
  .mrow:hover { background: color-mix(in srgb, var(--panel) 55%, transparent); }
  .mrow:active { background: var(--panel); box-shadow: var(--lift); }
  .mrow .i { color: var(--muted); }
  .mrow .grow { flex: 1; min-width: 0; }
  .mrow small { display: block; color: var(--muted); font: 11.5px var(--font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mrow[aria-pressed="true"] { background: var(--panel); box-shadow: var(--lift); }
  .art { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; }

  /* 作業中ポップオーバー・メニュー */
  .pop { position: fixed; z-index: 45; background: var(--panel); border-radius: 12px; box-shadow: var(--pop); padding: 8px; animation: pop 140ms var(--ease); min-width: 220px; }
  .pop h3 { margin: 2px 6px 8px; font-size: 12px; font-weight: 500; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .work { display: grid; gap: 4px; padding: 10px; border-radius: 9px; background: var(--sunken); font-size: 12.5px; }
  .work .hd { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .work .hd .el { margin-left: auto; font: 400 11.5px var(--font-mono); color: var(--muted); }
  .work .w { font: 12px/1.5 var(--font-mono); color: var(--fg-2); overflow-wrap: anywhere; }
  .work .p { color: var(--muted); }
  .menu-list { display: grid; gap: 2px; padding: 2px; background: var(--sunken); border-radius: 10px; }
  .menu-list .mrow { font-size: 13px; min-height: 34px; }
  .menu-list .mrow.danger, .menu-list .mrow.danger .i { color: var(--crit); }

  /* トースト */
  .toasts { position: fixed; right: 16px; top: 56px; z-index: 70; display: grid; gap: 8px; width: min(380px, calc(100vw - 24px)); }
  .toast { display: flex; align-items: center; gap: 10px; padding: 10px 8px 10px 12px; border-radius: 12px; background: var(--panel); box-shadow: var(--pop); font-size: 13px;
    animation: tin 220ms var(--ease); }
  .toast .i { color: var(--muted); }
  .toast.error .i { color: var(--crit); } .toast.warn .i { color: var(--warn); }
  .toast .grow { flex: 1; min-width: 0; }
  @keyframes tin { from { opacity: 0; transform: translateY(-6px); } }

  /* ツールチップ */
  .tip { position: fixed; z-index: 100; padding: 4px 8px; font-size: 12px; line-height: 1.4; background: var(--invert-bg); color: var(--invert-fg); border-radius: 6px; pointer-events: none;
    opacity: 0; transform: translateY(2px); transition: opacity 100ms, transform 100ms; white-space: nowrap; }
  .tip.show { opacity: 1; transform: none; }

  /* デモパネル（モック専用） */
  .demo-tab { position: fixed; right: 0; top: 46%; z-index: 60; writing-mode: vertical-rl; border: 0; padding: 10px 5px; border-radius: 8px 0 0 8px; font-size: 11px;
    background: var(--panel); color: var(--muted); box-shadow: var(--lift); display: inline-flex; align-items: center; gap: 6px; }
  .demo-tab .i { width: 14px; height: 14px; }
  .demo { position: fixed; right: 16px; bottom: 112px; z-index: 65; width: 300px; background: var(--panel); border-radius: 14px; box-shadow: var(--pop); padding: 10px 12px 12px; font-size: 12px; }
  .demo h3 { margin: 0 0 8px; font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
  .demo h3 .ib { margin-left: auto; width: 26px; height: 26px; }
  .demo .flags { display: flex; flex-wrap: wrap; gap: 4px; }
  .demo .flags .opt { padding: 3px 8px; font-size: 11.5px; background: var(--sunken); }
  .demo .flags .opt[aria-pressed="true"] { background: var(--panel); }
  .demo .eyebrow { margin: 10px 0 5px; }
  .states { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .states .lab { font-size: 10.5px; color: var(--muted); text-align: center; }
  .states > div { display: grid; gap: 3px; justify-items: center; }

  /* ================= スマホ ================= */
  .sbar, .dock, .tomini { display: none; }
  @media (max-width: 899px) {
    body { font-size: 15px; }
    .app { grid-template-columns: minmax(0, 1fr); }
    .rail, .side, .top, .strip { display: none; }
    .main { grid-template-rows: auto auto minmax(0, 1fr) auto auto; }
    .sbar { display: flex; align-items: center; gap: 4px; height: calc(var(--sbar) + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 4px 0 14px;
      background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; position: relative; z-index: 41; }
    .sbar h1 { margin: 0; flex: 1; min-width: 0; font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sbar .hit { position: relative; border: 0; background: transparent; height: var(--sbar); min-width: var(--tap); padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border-radius: 10px; color: var(--fg-2); font-size: 12px; transition: background-color var(--t); }
    .sbar .hit::before { content: ""; position: absolute; inset: -2px 0; }
    .sbar .hit:active { background: var(--sunken); }
    .sbar .hit.q .i { color: var(--warn); }
    .sdots { display: inline-flex; gap: 10px; padding: 6px 10px; border-radius: 8px; background: var(--sunken); }
    .sd { width: 8px; height: 8px; border-radius: 2px; position: relative; }
    .sd.claude { background: var(--claude); --agent: var(--claude); } .sd.codex { background: var(--codex); --agent: var(--codex); }
    .sd.idle { opacity: .45; }
    .sd.busy::after { content: ""; position: absolute; inset: -3px; border-radius: 4px; border: 1px solid var(--agent); animation: ping 1.4s ease-out infinite; }
    .sd.starting { background: transparent; box-shadow: inset 0 0 0 1.5px var(--agent); animation: rot 1.2s linear infinite; }
    .conn { font-size: 12.5px; }

    .log { padding: 0 14px 20px; }
    .entry { grid-template-columns: 20px minmax(0, 1fr); gap: 6px 8px; padding: 14px 0; }
    .entry > :not(.mark):not(.head) { grid-column: 1 / -1; }
    .mark { width: 20px; height: 20px; font-size: 10.5px; }
    .steps summary, .envelope summary { min-height: var(--tap); font-size: 12.5px; padding-right: 12px; }
    .code-head { padding-left: 12px; }
    .code-head .ib { width: var(--tap); height: var(--tap); }
    .code pre { font-size: 12px; }
    .code-more { height: 72px !important; }
    .code-more .btn { min-height: var(--tap); }
    .route .task { margin-left: 0; }
    .ask .opt { min-height: var(--tap); }
    .ask .btn, .ask .field { min-height: var(--tap); }
    .ref { min-height: var(--tap); }
    .now { min-height: 36px; }

    .composer { padding: 6px 8px 6px; background: var(--bg); }
    .bar { display: none; }
    .box { grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: end; border-radius: 14px; padding: 3px; gap: 2px; }
    .box > .pending, .box > .uploads { grid-column: 1 / -1; }
    .tomini { display: flex; padding: 2px; gap: 0; border-radius: 11px; align-self: end; }
    .tomini .opt { width: var(--tap); height: var(--tap); padding: 0; border-radius: 9px; }
    .tomini .opt::before { width: 9px !important; height: 9px !important; border-radius: 2.5px !important; }
    textarea.input { font-size: 16px; padding: 12px 8px 10px; min-height: 48px; }
    .box .mob { display: inline-grid !important; width: var(--tap); height: var(--tap); margin-bottom: 2px; border-radius: 10px; }
    .box .send.mob { margin-right: 2px; }
    .pending { padding: 2px 2px 2px 10px; }
    .pending .ib { width: var(--tap); height: var(--tap); }
    .uploads { padding: 6px 6px 2px; }
    .up .ib { width: 36px; height: 36px; }

    .dock { display: block; padding: 4px 8px calc(6px + env(safe-area-inset-bottom)); background: var(--bg); position: relative; z-index: 41; }
    .dock .well { border-radius: 14px; padding: 3px; gap: 3px; }
    .dock .opt { flex: 1; flex-direction: column; gap: 1px; height: 50px; border-radius: 11px; font-size: 10.5px; padding: 0; }
    .dock .opt .i { width: 20px; height: 20px; }
    .dock .opt .badge { position: absolute; top: 5px; left: calc(50% + 7px); min-width: 15px; height: 15px; padding: 0 4px; border-radius: 5px; background: var(--panel); box-shadow: var(--ring);
      font: 600 9.5px/15px var(--font-mono); color: var(--fg); display: inline-flex; align-items: center; gap: 3px; }
    body.kbd .dock { display: none; }
    body.kbd .composer { padding-bottom: 6px; }
    body.kbd .pending { display: none; }

    .layer { place-items: end stretch; bottom: var(--dock-h, 0px); top: 0; z-index: 40; }
    .sheet, .sheet.wide { width: 100%; max-height: calc(100% - var(--sbar) - env(safe-area-inset-top) - 8px); border-radius: 18px 18px 0 0;
      box-shadow: 0 -1px 0 var(--line), 0 -12px 32px rgba(0,0,0,.14); animation: rise 220ms var(--ease); transition: transform 200ms var(--ease), height 220ms var(--ease); }
    .sheet[data-stage="half"] { height: 58%; }
    .sheet[data-stage="full"] { height: calc(100% - var(--sbar) - env(safe-area-inset-top) - 8px); }
    .sheet.dragging { transition: none; }
    @keyframes rise { from { transform: translateY(40%); opacity: .4; } }
    .grab { display: grid; place-items: center; height: 20px; touch-action: none; cursor: grab; }
    .grab::before { content: ""; width: 38px; height: 5px; border-radius: 3px; background: var(--line-strong); }
    .sheet-head { padding: 0 6px 6px 16px; touch-action: none; min-height: 50px; }
    .sheet-head .ib { width: var(--tap); height: var(--tap); }
    .sheet-body { padding: 0 12px 16px; }
    .seg .opt, .well .opt { min-height: var(--tap); }
    .btn, .btn.wide { min-height: var(--tap); }
    .select select { min-height: var(--tap); font-size: 16px; }
    .role-editor { font-size: 16px; }
    .convs .conv { min-height: 52px; padding-left: 12px; }
    .conv-row .ib { opacity: 1; width: var(--tap); height: var(--tap); margin-right: 2px; }
    .conv .t { font-size: 14px; }
    .mrow { min-height: 48px; }

    .toasts { left: 12px; right: 12px; top: calc(var(--sbar) + env(safe-area-inset-top) + 8px); width: auto; }
    .demo { right: 8px; left: 8px; width: auto; bottom: 150px; }
    .newer { min-height: 36px; bottom: 10px; }
  }
  /* フル幅のエージェントカード（スマホの Agent シート） */
  .acard-full { padding: 12px; border-radius: 12px; background: var(--panel); box-shadow: var(--lift); display: grid; gap: 10px; position: relative; overflow: hidden; }
  .acard-full[data-agent="claude"] { --agent: var(--claude); } .acard-full[data-agent="codex"] { --agent: var(--codex); }
  .acard-full .hd { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
  .acard-full .hd .acts { margin-left: auto; }
  .acard-full .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .acard-full .role { font-size: 12.5px; color: var(--muted); }
  .gauges { display: grid; gap: 8px; }
  .gauge { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 8px; font-size: 12px; }
  .gauge .k { color: var(--muted); } .gauge .v { font-family: var(--font-mono); color: var(--fg-2); }
  .gauge.over .v { color: var(--warn); }
  .gauge .track { grid-column: 1 / -1; height: 5px; }
  .acard-full.busy::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1.5px;
    background: linear-gradient(90deg, transparent, var(--agent), transparent); background-size: 50% 100%; background-repeat: no-repeat; animation: sweep 1.6s linear infinite; }
  .stack { display: grid; gap: 8px; padding: 2px; background: var(--sunken); border-radius: 14px; }
  @media (max-width: 899px) { .acard-full .acts .ib { width: var(--tap); height: var(--tap); } .acard-full .chip { min-height: 30px; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
    .progress::before { left: 0; width: 40%; }
    .sk { background: var(--sunken); }
  }
</style>

<script>
(() => {
  const P = new URLSearchParams(location.search);
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const ic = (n, c = "") => `<svg class="i ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
  const ib = (icon, label, extra = "", cls = "") => `<button type="button" class="ib ${cls}" aria-label="${label}" title="${label}" ${extra}>${ic(icon)}</button>`;
  const MOBILE_Q = matchMedia("(max-width: 899px)");
  const DEMO_ALIASES = {
    loading: ["history", "starting", "sending", "upload", "reconnect", "applying", "switching"],
    boot: ["boot"],
  };
  const DEMO_FLAGS = [
    ["boot", "初回ロード"], ["history", "前ページ"], ["starting", "起動中ターン"], ["sending", "送信中"],
    ["upload", "アップロード"], ["applying", "model 変更中"], ["switching", "会話の切り替え"],
    ["reconnect", "再接続"], ["closed", "CLOSED"], ["toast", "トースト"], ["newer", "新着"],
  ];
  const AG = { claude: { name: "Claude", mark: "C" }, codex: { name: "Codex", mark: "X" } };
  const PERMS = ["read-only", "edit", "full"];
  const EFFORTS = { claude: ["low", "medium", "high", "xhigh", "max"], codex: ["minimal", "low", "medium", "high", "xhigh"] };
  const MODELS = { claude: ["Opus 5.5", "Sonnet 5", "Haiku 5"], codex: ["GPT-6-Astra", "GPT-6-mini"] };

  const S = {
    flags: new Set((P.get("demo") || "").split(",").filter(Boolean).flatMap((f) => DEMO_ALIASES[f] || [f])),
    to: "claude",
    detail: false,
    sideOpen: true,
    sheet: null,       // { kind, agent, stage }
    pop: null,
    kbd: P.get("kbd") === "1",
    answer: null,
    answered: false,
    theme: P.get("theme") || "system",
    agents: {
      claude: { status: "idle", model: "Opus 5.5", effort: "high", perm: "edit", role: "設計・実装・統合。仕様の判断はユーザーに確認", g: { ctx: [42, "84k / 200k"], h5: [61, 48, "20:20"], wk: [33, 40, "10/09 14:00"] } },
      codex: { status: "busy", since: "1分12秒", model: "GPT-6-Astra", effort: "medium", perm: "full", role: "レビューとテスト。実装は頼まれた範囲だけ", g: { ctx: [18, "180k / 1000k"], h5: [24, 48, "20:20"], wk: [71, 40, "10/09 14:00"] } },
    },
  };
  const has = (f) => S.flags.has(f);
  const anyLoading = () => ["boot", "history", "starting", "sending", "reconnect", "applying", "switching"].some(has);
  const agentStatus = (id) => (id === "claude" && has("starting")) ? "starting" : S.agents[id].status;
  const STATUS_LABEL = { busy: "作業中", idle: "待機中", starting: "起動中…", stopped: "停止中" };

  /* ---------- 部品 ---------- */
  const stLabel = (id) => {
    const s = agentStatus(id);
    const inner = s === "starting" ? `<span class="spin" style="color:var(--agent);width:10px;height:10px"></span>` : `<span class="pulse"></span>`;
    const el = s === "busy" ? `<span class="el">${S.agents[id].since}</span>` : "";
    return `<span class="st ${s}">${inner}${STATUS_LABEL[s]}${el}</span>`;
  };
  const mini = (label, full, [v, tick], over) =>
    `<div class="mini ${over ? "over" : ""}" title="${full} ${v}%"><span>${label}</span><div class="track"><i style="width:${v}%"></i>${tick != null ? `<span class="tick" style="left:${tick}%"></span>` : ""}</div><b>${v}%</b></div>`;
  const isOver = ([v, tick]) => tick != null && v > tick + 20;
  const agentActs = (id) => {
    const busy = agentStatus(id) === "busy";
    return `<div class="acts">${ib("stop", `${AG[id].name} を中断`, `data-act="interrupt" data-agent="${id}" ${busy ? "" : "disabled"}`, "danger")}${ib("shrink", `${AG[id].name} を Compact`, `data-act="compact" data-agent="${id}"`)}${ib("sliders", `${AG[id].name} の設定`, `data-act="settings" data-agent="${id}"`)}</div>`;
  };
  const stripCard = (id) => {
    const a = S.agents[id];
    if (has("boot")) return `<article class="acard" data-agent="${id}"><span class="mark ${id}">${AG[id].mark}</span><div class="who" style="gap:6px"><span class="sk" style="width:110px;height:11px"></span><span class="sk" style="width:150px;height:9px"></span></div><div class="minis"><span class="sk" style="height:10px"></span><span class="sk" style="height:10px"></span><span class="sk" style="height:10px"></span></div><div class="acts">${ib("stop", `${AG[id].name} を中断`, "disabled")}${ib("shrink", "Compact", "disabled")}${ib("sliders", "設定", "disabled")}</div></article>`;
    const s = agentStatus(id);
    const gaugeSk = id === "codex" && has("applying");
    return `<article class="acard ${s}" data-agent="${id}">

  const agentFull = (id) => {
    const a = S.agents[id];
    const g = (k, label, [v, tick, reset], extra) => `<div class="gauge ${isOver([v, tick]) ? "over" : ""}"><span class="k">${label}${reset ? ` · ${reset} にリセット` : ""}</span><span class="v">${extra || v + "%"}</span><div class="track"><i style="width:${v}%"></i>${tick != null && k !== "ctx" ? `<span class="tick" style="left:${tick}%"></span>` : ""}</div></div>`;
    return `<div class="acard-full ${agentStatus(id)}" data-agent="${id}"><div class="hd"><span class="mark ${id}">${AG[id].mark}</span>${AG[id].name}${stLabel(id)}${agentActs(id)}</div>
      <div class="role">${a.role}</div>
      <div class="chips"><button class="chip" type="button" data-act="settings" data-agent="${id}">${a.model}</button><button class="chip" type="button" data-act="settings" data-agent="${id}">${a.effort}</button><button class="chip" type="button" data-act="settings" data-agent="${id}">${a.perm === "full" ? `<span class="dot warn"></span>` : ""}${a.perm}</button></div>
      <div class="gauges">${g("ctx", "コンテキスト", [a.g.ctx[0], null], a.g.ctx[1])}${g("h5", "5 時間", a.g.h5)}${g("wk", "週", a.g.wk)}</div></div>`;
  };
  const menu = () => `<div class="eyebrow" style="margin-top:4px">プロジェクト</div>
      <div class="well col" style="gap:2px">${[["Clodex", "E:\\dev\\Clodex"], ["hirahub", "E:\\dev\\hirahub"]].map(([n, p], i) => `<button type="button" class="opt mrow" aria-pressed="${i === 0}">${ic("folder")}<span class="grow">${n}<small>${p}</small></span></button>`).join("")}
        <button type="button" class="opt mrow" data-act="open-project">${ic("folder-plus")}<span class="grow">プロジェクトを開く</span></button></div>
      <div class="eyebrow">表示</div>
      <div class="well col"><button type="button" class="opt mrow" data-act="artifacts">${ic("files")}<span class="grow">成果物<small>5 件</small></span>${ic("right", "s")}</button></div>
      ${generalSettings()}`;
  const SHEETS = {
    agentSettings: (s) => ({ title: `<span class="mark ${s.agent}">${AG[s.agent].mark}</span>${AG[s.agent].name} の設定`, body: agentSettings(s.agent), back: MOBILE_Q.matches ? "agents" : null }),
    settings: () => ({ title: "設定", body: generalSettings() }),
    artifacts: () => ({ title: "成果物", body: artifacts(), wide: true, back: MOBILE_Q.matches ? "menu" : null }),
    conversations: () => ({ title: "会話", body: convList(), head: ib("new", "新しい会話") }),
    agents: () => ({ title: "Agent", body: `${workingCount() ? `<div class="eyebrow" style="margin-top:2px">${ic("activity", "s")}作業中 ${workingCount()}</div>${workingList()}<div class="eyebrow">状態</div>` : ""}<div class="stack">${agentFull("claude")}${agentFull("codex")}</div>` }),
    menu: () => ({ title: "メニュー", body: menu() }),
  };
  const renderSheet = () => {
    const host = $("#layer-host");
    if (!S.sheet) { host.innerHTML = ""; return; }
    const v = SHEETS[S.sheet.kind](S.sheet);
    const stage = S.sheet.stage || "half";
    host.innerHTML = `<div class="layer"><button class="scrim" type="button" aria-label="閉じる" data-act="close"></button>
      <div class="sheet ${v.wide ? "wide" : ""}" role="dialog" aria-modal="true" aria-labelledby="sheet-title" data-stage="${stage}">
        <div class="grab" aria-hidden="true"></div>
        <div class="sheet-head">${v.back ? ib("left", "戻る", `data-back="${v.back}"`) : ""}<h2 id="sheet-title">${v.title}</h2>${v.head || ""}${ib("x", "閉じる", `data-act="close"`)}</div>
        <div class="sheet-body">${v.body}</div></div></div>`;
    bindDrag($(".sheet", host));
  };

  /* ---------- ポップオーバー ---------- */
  const renderPop = () => {
    const host = $("#pop-host");
    if (!S.pop) { host.innerHTML = ""; return; }
    let anchor, html, alignRight = false;
    if (S.pop === "working") { anchor = $("#tab-working"); html = `<h3>${ic("activity", "s")}作業中</h3>${workingList()}`; alignRight = true; }
    else if (S.pop === "proj") { anchor = $("#proj"); html = `<div class="menu-list" role="menu">${[["Clodex", "E:\\dev\\Clodex"], ["hirahub", "E:\\dev\\hirahub"]].map(([n, p], i) => `<button class="mrow" role="menuitem" type="button" ${i === 0 ? `aria-pressed="true"` : ""}>${ic("folder", "s")}<span class="grow">${n}<small>${p}</small></span>${i === 0 ? ic("check", "s") : ""}</button>`).join("")}<button class="mrow" role="menuitem" type="button">${ic("folder-plus", "s")}<span class="grow">プロジェクトを開く</span></button></div>`; }
    else if (S.pop.startsWith("conv")) { anchor = $(`[data-conv="${S.pop.slice(4)}"]`); html = `<div class="menu-list" role="menu"><button class="mrow" role="menuitem" type="button">${ic("pencil", "s")}名前を変更</button><button class="mrow" role="menuitem" type="button">${ic("pin", "s")}ピン止めを外す</button><button class="mrow danger" role="menuitem" type="button">${ic("trash", "s")}削除</button></div>`; }
    if (!anchor) { host.innerHTML = ""; return; }
    host.innerHTML = `<div class="pop" style="width:${S.pop === "working" ? 340 : 240}px">${html}</div>`;
    const r = anchor.getBoundingClientRect(), p = $(".pop", host);
    p.style.top = `${r.bottom + 6}px`;
    p.style.left = `${alignRight ? r.right - p.offsetWidth : Math.min(r.left, innerWidth - p.offsetWidth - 8)}px`;
  };

  /* ---------- トースト・デモ ---------- */
  const toast = (text, kind = "error", action = "") => {
    const t = document.createElement("div");
    t.className = `toast ${kind}`;
    t.innerHTML = `${ic(kind === "error" ? "alert" : "info")}<span class="grow">${text}</span>${action}${ib("x", "閉じる", `data-act="toast-close"`)}`;
    $("#toasts").append(t);
  };
  const renderDemo = () => {
    $("#demo").innerHTML = `<h3>${ic("flask", "s")}デモ${ib("x", "閉じる", `id="demo-close"`)}</h3>
      <div class="flags">${DEMO_FLAGS.map(([k, l]) => `<button type="button" class="opt" data-flag="${k}" aria-pressed="${has(k)}">${l}</button>`).join("")}</div>
      <div class="eyebrow">テーマ</div>${seg("theme", ["system", "light", "dark"], S.theme, (v) => ({ system: "システム", light: "ライト", dark: "ダーク" })[v])}
      <div class="eyebrow">部品の状態</div>
      <div class="states">${[["is-hover", "hover"], ["is-press", "press"], ["sel", "selected"], ["dis", "disabled"], ["is-focus", "focus"], ["is-loading", "loading"]].map(([c, l]) => {
        const attr = c === "sel" ? `aria-pressed="true"` : c === "dis" ? "disabled" : "";
        const cls = c.startsWith("is-") ? c : "";
        return `<div><span style="display:flex;gap:4px;align-items:center"><button type="button" class="btn ${cls}" ${attr} style="min-height:28px;padding:2px 9px;font-size:12px"><span>変更</span></button><button type="button" class="ib ${cls}" ${attr} aria-label="${l}" title="${l}" style="width:28px;height:28px">${ic("sliders", "s")}</button></span><span class="well" style="padding:2px"><button type="button" class="opt ${cls}" ${attr} style="padding:2px 8px;font-size:11.5px"><span>Codex</span></button></span><span class="lab">${l}</span></div>`;
      }).join("")}</div>`;
  };

  const render = () => {
    const th = S.theme === "system" ? null : S.theme;
    if (th) document.documentElement.dataset.theme = th; else delete document.documentElement.dataset.theme;
    renderTop(); renderSide(); renderLog(); renderComposer(); renderDock(); renderSheet(); renderPop(); renderDemo();
    $("#newer").hidden = !has("newer");
  };

  /* ---------- シートのドラッグ（つまみ・見出しを下へ） ---------- */
  const CLOSE_PX = 90, FULL_PX = -50;
  function bindDrag(sheet) {
    if (!MOBILE_Q.matches) return;
    let y0 = null;
    const zones = [$(".grab", sheet), $(".sheet-head", sheet)];
    zones.forEach((z) => z.addEventListener("pointerdown", (e) => {
      if (e.target.closest("button")) return;
      y0 = e.clientY; sheet.classList.add("dragging"); z.setPointerCapture(e.pointerId);
    }));
    zones.forEach((z) => z.addEventListener("pointermove", (e) => {
      if (y0 == null) return;
      sheet.style.transform = `translateY(${Math.max(0, e.clientY - y0)}px)`;
    }));
    zones.forEach((z) => z.addEventListener("pointerup", (e) => {
      if (y0 == null) return;
      const dy = e.clientY - y0; y0 = null;
      sheet.classList.remove("dragging"); sheet.style.transform = "";
      if (dy > CLOSE_PX) { if (S.sheet.stage === "full") { S.sheet.stage = "half"; sheet.dataset.stage = "half"; } else closeSheet(); }
      else if (dy < FULL_PX) { S.sheet.stage = "full"; sheet.dataset.stage = "full"; }
    }));
  }
  const openSheet = (kind, extra = {}) => { S.pop = null; S.sheet = { kind, stage: MOBILE_Q.matches && ["agentSettings", "artifacts"].includes(kind) ? "full" : "half", ...extra }; render(); };
  const closeSheet = () => { S.sheet = null; render(); };

  /* ---------- 押した後の待ち（ボタン内スピナー） ---------- */
  const PENDING_MS = 1400;
  const withPending = (btn, after) => {
    btn.classList.add("is-loading"); btn.setAttribute("aria-busy", "true");
    setTimeout(() => { btn.classList.remove("is-loading"); btn.removeAttribute("aria-busy"); after?.(); }, PENDING_MS);
  };

  document.addEventListener("click", (e) => {
    const t = e.target.closest("button");
    if (!t) { if (S.pop && !e.target.closest(".pop")) { S.pop = null; render(); } return; }
    if (t.dataset.flag) { const f = t.dataset.flag; S.flags.has(f) ? S.flags.delete(f) : S.flags.add(f); if (f === "toast" && S.flags.has(f)) toast("送信できませんでした（503）"); render(); return; }
    if (t.dataset.to) { S.to = t.dataset.to; render(); return; }
    if (t.dataset.tab) { const k = t.dataset.tab; if (k === "log") closeSheet(); else openSheet(k); return; }
    if (t.dataset.back) { openSheet(t.dataset.back); return; }
    if (t.dataset.conv) { S.pop = S.pop === "conv" + t.dataset.conv ? null : "conv" + t.dataset.conv; render(); return; }
    if (t.dataset.ans) { S.answer = Number(t.dataset.ans); render(); return; }
    if (t.closest("[data-seg]")) {
      const k = t.closest("[data-seg]").dataset.seg, v = t.dataset.v;
      if (k === "theme") S.theme = v; else if (k === "to") S.to = v; else if (k === "detail") S.detail = v === "open";
      else if (S.sheet?.agent) S.agents[S.sheet.agent][k] = v;
      render(); return;
    }
    const act = t.dataset.act;
    if (act === "close") return closeSheet();
    if (act === "settings") return openSheet("agentSettings", { agent: t.dataset.agent });
    if (act === "artifacts") return openSheet("artifacts");
    if (act === "toast-close") return t.closest(".toast").remove();
    if (act === "code-toggle") { S.detail = !S.detail; render(); return; }
    if (act === "copy") { t.innerHTML = ic("check"); t.setAttribute("aria-label", "コピー済み"); setTimeout(() => { t.innerHTML = ic("copy"); t.setAttribute("aria-label", "コピー"); }, 1500); return; }
    if (["compact", "interrupt", "apply-model", "save-role", "restart"].includes(act)) return withPending(t);
    switch (t.id) {
      case "r-conv": S.sideOpen = !S.sideOpen; render(); return;
      case "side-close": S.sideOpen = false; render(); return;
      case "r-detail": S.detail = !S.detail; render(); return;
      case "r-art": return S.sheet?.kind === "artifacts" ? closeSheet() : openSheet("artifacts");
      case "r-set": return S.sheet?.kind === "settings" ? closeSheet() : openSheet("settings");
      case "r-open": return withPending(t);
      case "new-conv": return withPending(t);
      case "proj": S.pop = S.pop === "proj" ? null : "proj"; render(); return;
      case "tab-working": S.pop = S.pop === "working" ? null : "working"; render(); return;
      case "tab-question": case "sb-q": $("#ask")?.scrollIntoView({ behavior: "smooth", block: "center" }); return;
      case "sb-agents": return openSheet("agents");
      case "answer": return withPending(t, () => { S.answered = true; render(); });
      case "reload": return withPending(t);
      case "demo-tab": $("#demo").hidden = false; t.hidden = true; return;
      case "demo-close": $("#demo").hidden = true; $("#demo-tab").hidden = false; return;
    }
    if (t.classList.contains("send")) { S.flags.add("sending"); render(); setTimeout(() => { S.flags.delete("sending"); render(); }, PENDING_MS); }
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if (S.pop) { S.pop = null; render(); } else if (S.sheet) closeSheet(); } });

  /* ---------- カスタム tooltip（title は残し、表示中だけ外す） ---------- */
  const TIP_DELAY_MS = 350;
  let tipTimer, tipEl;
  const showTip = (el) => {
    const text = el.getAttribute("title") || el.dataset.tip;
    if (!text) return;
    el.dataset.tip = text; el.removeAttribute("title");
    const tip = $("#tip"); tip.textContent = text;
    const r = el.getBoundingClientRect();
    const inRail = !!el.closest(".rail");
    tip.style.left = "0px"; tip.style.top = "0px"; tip.classList.add("show");
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = `${inRail ? r.right + 8 : Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2))}px`;
    tip.style.top = `${inRail ? r.top + r.height / 2 - h / 2 : (r.bottom + 6 + h > innerHeight ? r.top - h - 6 : r.bottom + 6)}px`;
    tipEl = el;
  };
  const hideTip = () => { clearTimeout(tipTimer); $("#tip").classList.remove("show"); if (tipEl) { tipEl.setAttribute("title", tipEl.dataset.tip); tipEl = null; } };
  document.addEventListener("pointerover", (e) => {
    if (e.pointerType !== "mouse") return;
    const el = e.target.closest("[title],[data-tip]");
    if (!el || el === tipEl) return;
    hideTip(); tipTimer = setTimeout(() => showTip(el), TIP_DELAY_MS);
  });
  document.addEventListener("pointerout", (e) => { if (tipEl && !tipEl.contains(e.relatedTarget)) hideTip(); else if (!tipEl) clearTimeout(tipTimer); });
  document.addEventListener("focusin", (e) => { const el = e.target.closest("[title],[data-tip]"); if (el && e.target.matches(":focus-visible")) showTip(el); });
  document.addEventListener("focusout", hideTip);

  /* ---------- URL の状態 ---------- */
  const OPEN = P.get("open");
  const mobile = MOBILE_Q.matches;
  if (OPEN === "sheet") S.sheet = { kind: "agentSettings", agent: "claude", stage: "full" };
  else if (OPEN === "drawer") { if (mobile) S.sheet = { kind: "conversations", stage: "half" }; else S.sideOpen = true; }
  else if (OPEN === "side-closed") S.sideOpen = false;
  else if (OPEN === "working") S.pop = mobile ? null : "working";
  else if (OPEN && SHEETS[OPEN]) S.sheet = { kind: OPEN, stage: OPEN === "agents" ? "full" : "half" };
  if (P.get("stage") && S.sheet) S.sheet.stage = P.get("stage");
  if (P.get("panel") === "1") { $("#demo").hidden = false; $("#demo-tab").hidden = true; }
  if (P.get("shot") === "1") $("#demo-tab").hidden = true;
  if (P.get("detail") === "1") S.detail = true;
  render();
  if (S.pop) requestAnimationFrame(renderPop);
  if (has("toast")) toast("送信できませんでした（503）");
  if (P.get("toast") === "1") toast("画像を添付できませんでした");
  MOBILE_Q.addEventListener("change", render);
  const log = $("#log");
  const INPUT_MAX_LINES = 5;
  const autosize = (ta) => { ta.style.height = "auto"; const lh = parseFloat(getComputedStyle(ta).lineHeight); ta.style.height = `${Math.min(ta.scrollHeight, lh * INPUT_MAX_LINES + 24)}px`; };
  document.addEventListener("input", (e) => { if (e.target.id === "input") autosize(e.target); });
  const settle = () => { const ta = $("#input"); if (ta) autosize(ta); log.scrollTop = P.get("top") === "1" ? 0 : log.scrollHeight; if (S.kbd) ta?.focus(); };
  requestAnimationFrame(settle);
  document.fonts.ready.then(settle);
})();
</script>
</body>
</html>
